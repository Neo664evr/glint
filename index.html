    <button aria-label="Orbit (explore)" aria-current=${on.explore?'page':'false'} onClick=${()=>nav({tab:'explore'})}><${I} n=${on.explore?'orbitOn':'orbit'}/></button>
    ${G.canWrite?html`<button aria-label="Create" onClick=${()=>openM({type:'create',mode:'post'})}><${I} n="seed"/></button>`:null}
    <button aria-label="Gleams" aria-current=${on.reels?'page':'false'} onClick=${()=>nav({tab:'reels'})}><${I} n=${on.reels?'flowOn':'flow'}/></button>
    ${me?html`<button aria-label="Signals (messages)" aria-current=${on.inbox?'page':'false'} onClick=${()=>nav({tab:'inbox'})}><${I} n=${on.inbox?'signalsOn':'signals'}/>${D.unreadThreads?html`<span class="badge">${D.unreadThreads}</span>`:null}</button>
    <button aria-label="Profile" aria-current=${on.me?'page':'false'} onClick=${()=>openUser(me)}><${Av} uid=${me}/></button>`:null}
  </div></nav>`}

function localAge(){try{return localStorage.getItem('glint-age')||''}catch(e){return ''}}
function AgeGate(){
  const [m,setM]=useState('');const [d,setD]=useState('');const [y,setY]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const blocked=G.prefs.minor||localAge()==='minor';
  const submit=async e=>{e.preventDefault();
    const mm=+m,dd=+d,yy=+y;const dt=new Date(yy,mm-1,dd);
    if(!mm||!dd||!yy||yy<1900||dt.getMonth()!==mm-1||dt>new Date())return setErr('Enter a real date of birth.');
    const now=new Date();let age=now.getFullYear()-yy;if(now.getMonth()<mm-1||(now.getMonth()===mm-1&&now.getDate()<dd))age--;
    const ok=age>=18;setBusy(true);
    try{localStorage.setItem('glint-age',ok?'adult':'minor')}catch(x){}
    try{if(G.canWrite)await savePrefs(p=>{if(ok)p.adult=Date.now();else p.minor=Date.now();return p})}catch(x){}
    setBusy(false);bump()};
  return html`<div class="center" style="min-height:100vh;padding:24px 16px"><div class="sheet" style="max-width:420px;margin:0 auto"><div class="sheet-b stack" style="text-align:center;align-items:center">
    <span class="wordmark" style="font-size:34px;flex:none"><span class="logo" dangerouslySetInnerHTML=${{__html:logo('gate')}}></span>glint</span>
    ${blocked?html`<h3 style="font-family:var(--font-display);margin:0">Glint is for adults</h3><p class="muted" style="margin:0">You need to be 18 or older to use Glint.</p>`
    :html`<h3 style="font-family:var(--font-display);margin:0">Glint is 18+</h3><p class="muted" style="margin:0">Enter your date of birth to continue. Only your age check is saved, not the date.</p>
      <form class="stack" style="width:100%" onSubmit=${submit}><div class="rowx" style="justify-content:center">
        <input id="age-m" class="field" style="width:70px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:16px;text-align:center" inputmode="numeric" maxlength="2" placeholder="MM" value=${m} onInput=${e=>setM(e.target.value.replace(/\D/g,''))}/>
        <input id="age-d" class="field" style="width:70px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:16px;text-align:center" inputmode="numeric" maxlength="2" placeholder="DD" value=${d} onInput=${e=>setD(e.target.value.replace(/\D/g,''))}/>
        <input id="age-y" class="field" style="width:96px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:16px;text-align:center" inputmode="numeric" maxlength="4" placeholder="YYYY" value=${y} onInput=${e=>setY(e.target.value.replace(/\D/g,''))}/></div>
        ${err?html`<div class="err" role="alert">${err}</div>`:null}
        <button class="btn primary block" type="submit" disabled=${busy}>Continue</button></form>`}
  </div></div></div>`}
function needsGate(){if(G.prefs.adult||localAge()==='adult')return false;if(G.me&&!G.prefsLoaded)return null;return true}
function App(){
  const [,force]=useState(0);useEffect(()=>{const f=()=>force(x=>x+1);listeners.add(f);return()=>listeners.delete(f)},[]);
  useEffect(()=>{document.body.style.overflow=G.modals.length?'hidden':'';document.documentElement.setAttribute('data-tab',G.route.tab)});
  useEffect(()=>{if(G.ready&&G.canWrite&&G.prefsLoaded&&!needsGate()&&!G.col.u.get(G.me)?.handle&&!G.onboarded){G.onboarded=true;setTimeout(()=>{if(!G.col.u.get(G.me)?.handle){openMRaw({type:'editprofile'});toast('Pick a username so people can find you.')}},1600)}});

  if(G.error)return html`<div class="center"><div class="empty"><span class="wordmark" style="font-size:34px"><span class="logo" dangerouslySetInnerHTML=${{__html:logo('2')}}></span>glint</span><h3>${G.error==='nodb'?'Sign in to see Glint':'Open Glint on claude.ai'}</h3><p>${G.error==='nodb'?'Posts load for people signed in to claude.ai who can open this page.':'Glint stores everything with this page, so it only works when opened from its claude.ai link.'}</p></div></div>`;
  if(!G.ready)return html`<div class="wrap"><main class="main"><div class="feed"><div class="skel" style="height:90px"></div><div class="skel"></div><div class="skel"></div></div></main></div>`;
  const gate=needsGate();if(gate===null)return html`<div class="center"></div>`;if(gate||G.prefs.minor)return html`<${WorldBg}/><div class="wrap"><${AgeGate}/></div>`;
  const t=G.route.tab;
  const view=t==='explore'?html`<${Explore}/>`:t==='tag'||t==='place'?html`<${TagView}/>`:t==='reels'?html`<${Reels}/>`:t==='activity'?html`<${Activity}/>`:t==='profile'?html`<${Profile} key=${G.route.uid}/>`:t==='inbox'?html`<${Inbox}/>`:t==='thread'?html`<${Thread} key=${G.route.g}/>`:t==='settings'?html`<${Settings}/>`:html`<${Home}/>`;
  const wide=t==='explore'||t==='tag'||t==='place'||t==='profile';
  return html`<${WorldBg}/><${Rail}/><div class="wrap"><${TopBar}/><main class=${'main'+(wide?' wide':'')}>${view}</main></div><${Tabs}/>
    ${G.modals.map((m,k)=>html`<${Modal} key=${k+':'+m.type} m=${m} top=${k===G.modals.length-1}/>`)}
    ${G.toast?html`<div class="toast glass thick" role="status">${G.toast}</div>`:null}`}

/* ================= boot ================= */
let profT;
function resolveProfiles(){clearTimeout(profT);profT=setTimeout(async()=>{if(!G.user)return;const ids=new Set([...Object.values(G.col).flatMap(m=>[...m.keys()])]);if(G.me)ids.add(G.me);
  try{const ps=await G.user.profiles([...ids]);G.profiles=ps;bump()}catch(e){}},120)}
function applyAccent(){try{document.documentElement.setAttribute('data-accent',G.prefs.accent)}catch(e){}}
function deepLink(){const h=location.hash||'';let m;
  if((m=/^#p\.([A-Za-z0-9_\-~]+)\.([a-f0-9]{8,40})$/.exec(h)))openM({type:'post',key:m[1]+'|'+m[2]});
  else if((m=/^#u\.([A-Za-z0-9_\-~]+)$/.exec(h)))nav({tab:'profile',uid:m[1],pt:'posts'},true)}
async function boot(){
  render(html`<${App}/>`,document.getElementById('app'));
  const c=window.claude;if(!c||typeof c.use!=='function'){G.error='offline';bump();return}
  const [db,user,room]=await Promise.all([c.use('db'),c.use('user'),c.use('room')]);
  G.db=db;G.user=user;G.room=room;
  if(!db){G.error='nodb';bump();return}
  G.me=user?await user.id():null;
  const can=user?await user.can('data.write'):null;
  G.canWrite=!!G.me&&can!==false;
  const cl={u:cleanU,p:cleanP,s:cleanS,sv:cleanSv,l:cleanL,c:cleanC,dm:cleanDM};const pending=new Set(Object.keys(cl));
  for(const [name,fn] of Object.entries(cl)){
    db.collection(name).onSnapshot(snap=>{const m=new Map();for(const d of snap.docs)if(d.exists&&UIDRE.test(d.id))m.set(d.id,fn(d.data()));G.col[name]=m;
      if(pending.delete(name)&&!pending.size){G.ready=true;deepLink()}
      bump();if(name==='u'||name==='dm')decryptPending();resolveProfiles()},e=>toast('Lost the live connection. Reload to see new activity.'));
  }
  if(G.me){db.doc(`data/users/${G.me}/prefs`).onSnapshot(s=>{G.prefs=cleanPrefs(s.exists?s.data():{});applyAccent();bump();
    if(!G.prefsLoaded){G.prefsLoaded=true;if(G.canWrite)waitReady().then(()=>ensureKeys()).catch(()=>{})}},()=>{})}
  if(room){try{room.onPeers(ch=>{G.peers=ch.peers;bump()},()=>{})}catch(e){}}
  setInterval(()=>{if(G.ready&&!document.hidden)bump()},60000);
}
function waitReady(){return new Promise(r=>{const t=setInterval(()=>{if(G.ready){clearInterval(t);r()}},100)})}
boot();
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
